# Render Blueprint Specification at root level
services:
  - type: web
    name: mangodefend-apps-server
    runtime: docker
    dockerfilePath: ./mangodefend-apps-server/Dockerfile
    dockerContext: ./mangodefend-apps-server
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mangodefend-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "true"

databases:
  - name: mangodefend-postgres
    databaseName: mangodefend_app
    user: mangodefend
    plan: free
